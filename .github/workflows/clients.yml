name: Clients

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clients-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Build native core
        working-directory: .
        run: cargo build --locked --release -p nntdrive-ffi
      - run: |
          mkdir -p linux/lib
          cp ../../target/release/libnntdrive_ffi.so linux/lib/libnntdrive_ffi.so
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
        env:
          NNTDRIVE_FFI_PATH: ${{ github.workspace }}/clients/flutter/linux/lib/libnntdrive_ffi.so

  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Independent build; analyze remains a blocking required check.
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libayatana-appindicator3-dev
      - name: Build native core
        working-directory: .
        run: cargo build --locked --release -p nntdrive-ffi
      - run: |
          mkdir -p linux/lib
          cp ../../target/release/libnntdrive_ffi.so linux/lib/libnntdrive_ffi.so
      - run: flutter pub get
      - run: flutter build linux --release
      - run: cp linux/lib/libnntdrive_ffi.so build/linux/x64/release/bundle/lib/
      - run: tar -czf nntdrive-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nntdrive-linux-x64
          path: clients/flutter/nntdrive-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Independent build; analyze remains a blocking required check.
    defaults:
      run:
        working-directory: clients/flutter
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            clients/flutter/android/**/*.gradle.kts
            clients/flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: cargo install cargo-ndk --locked
      - name: Build native core
        working-directory: .
        run: |
          NDK_HOME="$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$NDK_HOME"
          export NDK_HOME
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o clients/flutter/android/app/src/main/jniLibs \
            build --locked --release -p nntdrive-ffi
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify APK native ABI coverage
        working-directory: .
        run: python3 scripts/check-android-apk.py clients/flutter/build/app/outputs/flutter-apk/app-release.apk
      - run: cp build/app/outputs/flutter-apk/app-release.apk nntdrive-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nntdrive-android
          path: clients/flutter/nntdrive-android.apk

  # Requires Developer Mode (symlink support) on the Windows runner.
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    # Independent build; analyze remains a blocking required check.
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Build native core
        working-directory: .
        run: cargo build --locked --release -p nntdrive-ffi
      - run: |
          mkdir windows/runner -Force
          copy ..\..\target\release\nntdrive_ffi.dll windows\runner\
      - run: flutter pub get
      - name: Test Windows native bridge and unit suite
        run: |
          $env:NNTDRIVE_FFI_PATH = Join-Path $env:GITHUB_WORKSPACE "target\release\nntdrive_ffi.dll"
          flutter test --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: flutter build windows --release
      - name: Verify bundled native DLL
        run: |
          if (!(Test-Path build\windows\x64\runner\Release\nntdrive_ffi.dll)) { throw "Native DLL missing from bundle" }
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nntdrive-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nntdrive-windows-x64
          path: clients/flutter/nntdrive-windows-x64.zip

  # Exercise the app on hosted Windows using the actual release DLL and bundle.
  windows-app-smoke:
    runs-on: windows-2022
    needs: build-windows
    timeout-minutes: 25
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nntdrive-windows-x64
          path: clients/flutter/windows-artifact
      - name: Extract release bundle and reuse its native DLL
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "nntdrive-release"
          Expand-Archive -Path "windows-artifact\nntdrive-windows-x64.zip" -DestinationPath $bundle -Force
          $dll = Join-Path $bundle "nntdrive_ffi.dll"
          if (!(Test-Path $dll)) { throw "Release bundle is missing nntdrive_ffi.dll" }
          Copy-Item $dll "windows\runner\nntdrive_ffi.dll" -Force
      - run: flutter pub get
      - name: Run Windows app integration smoke against the release DLL
        run: |
          if ($env:NNTDRIVE_FFI_PATH) { throw "Smoke test must load the bundled DLL, not NNTDRIVE_FFI_PATH" }
          flutter test integration_test/windows_app_smoke_test.dart -d windows --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Launch the packaged release app
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "nntdrive-release"
          $exe = Join-Path $bundle "nntdrive.exe"
          if (!(Test-Path $exe)) { throw "Release bundle is missing nntdrive.exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $bundle -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(20)
            do {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged app exited during startup with code $($process.ExitCode)"
              }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            $process.Refresh()
            if ($process.MainWindowHandle -eq [IntPtr]::Zero) {
              throw "Packaged app did not create a Windows window"
            }
            if ($process.MainWindowTitle -ne "nntdrive") {
              throw "Unexpected app window title: $($process.MainWindowTitle)"
            }
          } finally {
            $process.Refresh()
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  # Runtime smoke, not backend/sync E2E. Reuse the actual packaged x86_64 core.
  android-native-smoke:
    runs-on: ubuntu-24.04
    needs: build-android
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            clients/flutter/android/**/*.gradle.kts
            clients/flutter/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nntdrive-android
          path: android-apk
      - name: Reuse packaged native core
        run: |
          unzip -q android-apk/nntdrive-android.apk 'lib/x86_64/libnntdrive_ffi.so' -d "$RUNNER_TEMP/native"
          mkdir -p clients/flutter/android/app/src/main/jniLibs/x86_64
          cp "$RUNNER_TEMP/native/lib/x86_64/libnntdrive_ffi.so" clients/flutter/android/app/src/main/jniLibs/x86_64/
      - name: Require KVM and reclaim unused hosted-runner SDK space
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Android stays installed; this job does not use .NET.
          sudo rm -rf /usr/share/dotnet
          df -h .
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          working-directory: clients/flutter
          script: flutter test integration_test/android_native_test.dart -d emulator-5554 --reporter expanded
