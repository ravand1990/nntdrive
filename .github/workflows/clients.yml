name: Clients

# The Flutter client is a UI/API scaffold: the Rust crypto/sync bridge is not
# wired yet, so this workflow is intentionally non-blocking. Remove
# `continue-on-error` once clients/flutter/lib/rust_bridge.dart is implemented.
on:
  workflow_dispatch:
  push:
    paths:
      - "clients/flutter/**"
      - ".github/workflows/clients.yml"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: clients/flutter
        run: flutter pub get
      - working-directory: clients/flutter
        run: flutter analyze

  build-linux:
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libfuse3-dev ninja-build
      - working-directory: clients/flutter
        run: flutter pub get && flutter build linux --debug

  build-android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: clients/flutter
        run: flutter pub get && flutter build apk --debug

  build-windows:
    runs-on: windows-2022
    continue-on-error: true
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: clients/flutter
        run: flutter pub get; flutter build windows --debug

  build-ios:
    runs-on: macos-14
    continue-on-error: true
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: clients/flutter
        run: flutter pub get && flutter build ios --no-codesign --debug
