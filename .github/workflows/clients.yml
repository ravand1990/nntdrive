name: Clients

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/flutter/**"
      - "crates/**"
      - ".github/workflows/clients.yml"
  pull_request:
    paths:
      - "clients/flutter/**"
      - "crates/**"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Build native core
        working-directory: .
        run: cargo build --release -p nntdrive-ffi
      - run: |
          mkdir -p linux/lib
          cp ../../target/release/libnntdrive_ffi.so linux/lib/libnntdrive_ffi.so
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          NNTDRIVE_FFI_PATH: ${{ github.workspace }}/clients/flutter/linux/lib/libnntdrive_ffi.so

  build-linux:
    runs-on: ubuntu-24.04
    needs: analyze
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build native core
        working-directory: .
        run: cargo build --release -p nntdrive-ffi
      - run: |
          mkdir -p linux/lib
          cp ../../target/release/libnntdrive_ffi.so linux/lib/libnntdrive_ffi.so
      - run: flutter pub get
      - run: flutter build linux --release
      - run: cp linux/lib/libnntdrive_ffi.so build/linux/x64/release/bundle/lib/
      - run: tar -czf nntdrive-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: nntdrive-linux-x64
          path: clients/flutter/nntdrive-linux-x64.tar.gz

  build-android:
    runs-on: ubuntu-24.04
    needs: analyze
    defaults:
      run:
        working-directory: clients/flutter
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: cargo install cargo-ndk --locked
      - name: Build native core
        working-directory: .
        run: |
          NDK_HOME="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          export NDK_HOME
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o clients/flutter/android/app/src/main/jniLibs \
            build --release -p nntdrive-ffi
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk nntdrive-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nntdrive-android
          path: clients/flutter/nntdrive-android.apk

  # Requires Developer Mode (symlink support) on the Windows runner.
  build-windows:
    runs-on: windows-2022
    needs: analyze
    continue-on-error: true
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Build native core
        working-directory: .
        run: cargo build --release -p nntdrive-ffi
      - run: |
          mkdir windows/runner -Force
          copy ..\..\target\release\nntdrive_ffi.dll windows\runner\
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nntdrive-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nntdrive-windows-x64
          path: clients/flutter/nntdrive-windows-x64.zip

  # Requires macOS/Xcode; unsigned compile only until the Rust static library is
  # packaged as an XCFramework and the File Provider extension exists.
  build-ios:
    runs-on: macos-14
    needs: analyze
    continue-on-error: true
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --debug
