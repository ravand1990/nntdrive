name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nntdrive
          POSTGRES_PASSWORD: nntdrive_test
          POSTGRES_DB: nntdrive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nntdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes real PostgreSQL and the mock NNTP server)
        run: cargo test --workspace --all-targets
      - name: Build release binaries
        run: cargo build --release -p nntdrive-backend -p nntdrive-cli
      - name: Storage demo (Phase 1/2 end-to-end)
        run: ./target/release/nntdrive demo --keyfile-out /tmp/demo.keyfile.json

  docker:
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: nntdrive/backend:ci
