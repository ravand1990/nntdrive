name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nntdrive
          POSTGRES_PASSWORD: nntdrive_test
          POSTGRES_DB: nntdrive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nntdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Validate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/ci-rust-tests.sh
      - run: cargo build --release -p nntdrive-cli
      - run: ./target/release/nntdrive demo --keyfile-out /tmp/demo-keyfile.json

  image:
    needs: test
    # One native runner per architecture; the digests are merged into a single
    # multi-arch manifest by the image-manifest job. QEMU is deliberately not
    # used: emulating an arm64 Rust release build would dominate the release.
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nntdrive-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=NNTDrive backend
            org.opencontainers.image.description=Self-hosted end-to-end encrypted storage on Usenet
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push the ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/nntdrive-backend,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

      - name: Stage the digest for the multi-arch manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build-push-action returned no usable digest: '$digest'" >&2
            exit 1
          fi
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Collect the per-architecture digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nntdrive-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=NNTDrive backend
            org.opencontainers.image.description=Self-hosted end-to-end encrypted storage on Usenet
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nntdrive-backend
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [[ "$count" -ne 2 ]]; then
            echo "expected 2 per-architecture digests, found $count" >&2
            exit 1
          fi
          tags="$(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          if [[ -z "$tags" ]]; then
            echo "metadata action produced no tags" >&2
            exit 1
          fi
          digests=()
          for digest in *; do
            digests+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create $tags "${digests[@]}"

      - name: Verify both architectures are in the published manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nntdrive-backend:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" | tee "$RUNNER_TEMP/manifest.txt"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -q "Platform: *$platform" "$RUNNER_TEMP/manifest.txt"; then
              echo "published manifest has no $platform entry" >&2
              exit 1
            fi
          done

      - name: Write release summary
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nntdrive-backend
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{json .Manifest}}' | jq -r '.digest')"
          {
            echo "## NNTDrive container image"
            echo ""
            echo "Image: \`${IMAGE}\`"
            echo ""
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo ""
            echo "Manifest digest: \`${digest}\`"
            echo ""
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  clients:
    needs: test
    uses: ./.github/workflows/clients.yml

  github-release:
    needs: [image-manifest, clients]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nntdrive-*
          path: dist
          merge-multiple: true
      - name: Name release assets with version and platform
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mv dist/nntdrive-linux-x64.tar.gz "dist/nntdrive-${VERSION}-linux-x64.tar.gz"
          mv dist/nntdrive-windows-x64.zip "dist/nntdrive-${VERSION}-windows-x64.zip"
          mv dist/nntdrive-android.apk "dist/nntdrive-${VERSION}-android.apk"
          # Compatibility aliases: clients released before versioned asset names
          # look for these exact filenames. Remove after those clients can no
          # longer update (shortcut: keep until two releases use versioned names).
          cp "dist/nntdrive-${VERSION}-linux-x64.tar.gz" dist/nntdrive-linux-x64.tar.gz
          cp "dist/nntdrive-${VERSION}-windows-x64.zip" dist/nntdrive-windows-x64.zip
      - name: Publish the Android version code for the in-app updater
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # The Android client compares version codes, not display versions.
          BUILD_NUMBER=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' clients/flutter/pubspec.yaml)
          if [ -z "$BUILD_NUMBER" ]; then
            echo "clients/flutter/pubspec.yaml has no build number" >&2
            exit 1
          fi
          printf '{"version":"%s","versionCode":%s}\n' "$VERSION" "$BUILD_NUMBER" \
            > "dist/nntdrive-${VERSION}-android.json"
      - name: Generate update checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Create GitHub release and attach deployment and client files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/nntdrive-backend:${VERSION}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "Container image: \`${IMAGE}\` (multi-arch manifest for linux/amd64 and linux/arm64)"
            echo
            echo "Client builds: \`nntdrive-${VERSION}-linux-x64.tar.gz\`, \`nntdrive-${VERSION}-android.apk\` and \`nntdrive-${VERSION}-windows-x64.zip\`."
            echo "Checking for updates in the Windows/Linux clients uses this release feed; Android clients use the same feed and hand the verified APK to the system installer; iOS is not built yet."
            echo
            echo "## Changes"
            echo
            bash scripts/release-notes.sh "$TAG"
          } > "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
            gh release upload "$TAG" --clobber \
              dist/* \
              deploy/docker-compose.release.yml \
              deploy/env.release.example \
              deploy/nntdrive-compose.py \
              deploy/README-IMAGES.md
          else
            gh release create "$TAG" \
              --title "NNTDrive ${TAG}" \
              --notes-file "$NOTES_FILE" \
              dist/* \
              deploy/docker-compose.release.yml \
              deploy/env.release.example \
              deploy/nntdrive-compose.py \
              deploy/README-IMAGES.md
          fi
