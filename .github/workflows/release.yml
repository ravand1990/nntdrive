name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nntdrive
          POSTGRES_PASSWORD: nntdrive_test
          POSTGRES_DB: nntdrive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nntdrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      DATABASE_URL: postgres://nntdrive:nntdrive_test@127.0.0.1:5432/nntdrive_test
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo build --release -p nntdrive-cli
      - run: ./target/release/nntdrive demo --keyfile-out /tmp/demo-keyfile.json

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nntdrive-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=NNTDrive backend
            org.opencontainers.image.description=Self-hosted end-to-end encrypted storage on Usenet
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push versioned image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write release summary
        run: |
          echo "## NNTDrive container image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`ghcr.io/${{ github.repository_owner }}/nntdrive-backend\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release and attach deployment files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/nntdrive-backend:${TAG#v}"
          NOTES="Container image: \`${IMAGE}\` (linux/amd64, linux/arm64).

          Docker Compose: download \`docker-compose.release.yml\` and \`.env.release.example\` from this release's assets.
          Quick start: see \`README-IMAGES.md\` in the assets or README.md."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              deploy/docker-compose.release.yml \
              deploy/.env.release.example \
              deploy/README-IMAGES.md
          else
            gh release create "$TAG" \
              --title "NNTDrive ${TAG}" \
              --generate-notes \
              --notes "$NOTES" \
              deploy/docker-compose.release.yml \
              deploy/.env.release.example \
              deploy/README-IMAGES.md
          fi
