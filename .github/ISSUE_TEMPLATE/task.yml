name: Task
description: Actionable NNTDrive task tracked in GitHub Issues
title: "Task: "
labels: ["priority:P2"]
body:
  - type: dropdown
    id: readiness
    attributes:
      label: Scheduling readiness
      description: New issues must start Backlog; only the coordinator can promote them to Ready.
      options:
        - Backlog
      default: 0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Use Project Status (not status labels), default Todo + Backlog. Change the
        default `priority:P2` label if this task is P0 or P1. Existing NNT IDs
        stay in the title; new tasks use the issue number instead.
        After filing, add the issue to the NNTDrive Project, explicitly set Todo,
        and verify membership/Status/readiness. This form does not set Project fields.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What changes for users or maintainers when this is done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / exclusions
      description: What is in scope, and what is explicitly not?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that prove the task is complete.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues as #123, or write "None".
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands, tests, builds, or manual checks required.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Ownership / branch / linked PR
      description: Worker, branch/worktree, assignee, and PR once claimed.
  - type: textarea
    id: handoff
    attributes:
      label: Handoff / blockers
      description: Current state, exact checks and results, blockers, next step.
