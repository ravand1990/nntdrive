name: Bug report
description: Something is broken or behaves unexpectedly
title: "Bug: "
labels: ["priority:P2"]
body:
  - type: markdown
    attributes:
      value: |
        New issues default to Project Status Backlog. Triage the priority after
        filing. Do not include secrets, tokens, recovery codes or private
        infrastructure details. After filing, add the issue to the NNTDrive
        Project, explicitly set Backlog, and verify membership and Status. This
        form does not set Project fields. Record scope, acceptance criteria,
        dependencies, ownership and handoff before scheduling implementation.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal steps, inputs, platform, and version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error text. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification / regression test
      description: How should a fix be proven? Commands, tests, or manual checks.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, related issues, screenshots, environment.
