[package]
name = "nntdrive-ffi"
description = "C ABI used by the Flutter clients (JSON in/out, no secrets logged)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "nntdrive_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
nntdrive-crypto = { path = "../crypto" }
nntdrive-client = { path = "../client" }
nntdrive-sync = { path = "../sync" }
chrono.workspace = true
unicode-normalization = "0.1.25"

# Free-space reporting for the client cache screen (#199). Both are maintained,
# target-specific and already present in the workspace dependency graph.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
