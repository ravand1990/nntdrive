[package]
name = "nntdrive-client"
description = "Rust client SDK: encrypted upload/download over the NNTDrive HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
base64.workspace = true
blake3.workspace = true
sha2 = "0.10"
zstd = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
nntdrive-crypto = { path = "../crypto" }
nntdrive-storage = { path = "../storage" }

[dev-dependencies]
nntdrive-backend = { path = "../backend" }
nntdrive-nntp = { path = "../nntp" }
tempfile = "3"
axum = "0.8"
