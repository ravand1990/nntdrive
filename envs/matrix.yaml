{
  "schema_version": 1,
  "toolchains": {
    "local": {"definition": "deploy/docker-compose.checks.yml", "rust": "1.99.1", "flutter": "3.47.9", "postgres": "16-alpine (digest in Compose)"},
    "github": {"definition": ".github/workflows/clients.yml", "flutter": "3.47.9", "java": "17", "rust": "stable (rolling, not fully pinned)", "android_emulator_api": 35, "linux_runner": "ubuntu-24.04", "windows_runner": "windows-2022"}
  },
