    "android-build": {"executor": "github", "artifact": "nntdrive-android", "timeout_seconds": 5400, "coverage": "release APK with three native ABIs; debug signing"},
    "android-emulator": {"executor": "github", "artifact": "nntdrive-android", "timeout_seconds": 5400, "coverage": "KVM native crypto/private-storage smoke; no backend sync E2E"},
    "windows-build": {"executor": "github", "artifact": "nntdrive-windows-x64", "timeout_seconds": 5400, "coverage": "hosted MSVC build and native unit tests; no clean-machine runtime"},
    "windows-runtime": {"executor": "blocked", "timeout_seconds": 1, "reason": "No approved isolated Windows runtime host/budget. Human provisioning and trust policy required; generic self-hosted runners are forbidden."}
