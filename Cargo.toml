[workspace]
resolver = "2"
members = [
  "crates/crypto",
  "crates/nntp",
  "crates/storage",
  "crates/sync",
  "crates/backend",
  "crates/cli",
  "crates/client",
  "crates/ffi",
]
# The clients are built from clients/flutter with Flutter tooling, not cargo.

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nntdrive/nntdrive"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
base64 = "0.22"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
