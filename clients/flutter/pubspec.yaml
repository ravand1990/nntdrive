name: nntdrive
description: NNTDrive cross-platform client (UI/API scaffold)
publish_to: "none"
version: 0.8.6+19

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  package_info_plus: ^8.0.0
  shared_preferences: ^2.3.0
  ffi: ^2.1.0
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  # Last stable platform-plugin APIs; avoid the separate nativeapi migration.
  tray_manager: 0.5.3
  window_manager: 0.5.2
  dbus: ^0.7.12

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.png
    - assets/tray.ico
