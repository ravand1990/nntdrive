name: nntdrive

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nntdrive
      POSTGRES_USER: nntdrive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - nntdrive-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nntdrive -d nntdrive"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the backend needs the database.
    expose:
      - "5432"

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://nntdrive:${POSTGRES_PASSWORD}@postgres:5432/nntdrive
      NNTDRIVE_BIND: 0.0.0.0:8080
      NNTDRIVE_CACHE_DIR: /var/lib/nntdrive/cache
    volumes:
      - nntdrive-cache:/var/lib/nntdrive/cache
    ports:
      - "${NNTDRIVE_HOST_BIND:-127.0.0.1}:${NNTDRIVE_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NNTDRIVE_DOMAIN: ${NNTDRIVE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nntdrive-pg:
  nntdrive-cache:
  caddy-data:
  caddy-config:
